name: ✨ Feature request
description: An idea to make PLANR better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like PLANR to do?
      description: The problem or moment in your day it would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
  - type: checkboxes
    id: offline
    attributes:
      label: PLANR stays offline
      options:
        - label: I understand PLANR has no internet access, so the idea shouldn't need a server.
