name: Release APK

# Two ways to release:
#  1. Actions → Release APK → Run workflow → enter a version (e.g. 0.2.0).
#     The tag vX.Y.Z is created on the chosen branch automatically.
#  2. Push a tag like v0.2.0.
# Re-running for an existing version replaces the release's APK.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version from tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NAME="${{ github.event.inputs.version }}"
            NAME="${NAME#v}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          TAG="v$NAME"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$NAME'"; exit 1
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$NAME"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (versionName=$NAME, versionCode=$CODE)"

      - name: Decode signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.PLANR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/planr-release.jks"
            echo "path=$RUNNER_TEMP/planr-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PLANR_KEYSTORE_BASE64 secret not set — signing with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          PLANR_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          PLANR_KEYSTORE_PASSWORD: ${{ secrets.PLANR_KEYSTORE_PASSWORD }}
          PLANR_KEY_ALIAS: ${{ secrets.PLANR_KEY_ALIAS }}
          PLANR_KEY_PASSWORD: ${{ secrets.PLANR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PplanrVersionName=${{ steps.ver.outputs.name }} \
            -PplanrVersionCode=${{ steps.ver.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PLANR-${{ steps.ver.outputs.name }}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: Release notes
        id: notes
        run: |
          F="release-notes/${{ steps.ver.outputs.tag }}.md"
          if [ ! -f "$F" ]; then
            F="$RUNNER_TEMP/notes.md"
            echo "PLANR ${{ steps.ver.outputs.name }} — an ExoSynk Labs project." > "$F"
          fi
          if [ "${{ steps.sign.outputs.signed }}" != "true" ]; then
            printf '\n> ⚠️ Signed with a temporary debug key. Uninstall this build before installing a later signed release.\n' >> "$F"
          fi
          echo "path=$F" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PLANR ${{ steps.ver.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ startsWith(steps.ver.outputs.name, '0.') }}
          overwrite_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
