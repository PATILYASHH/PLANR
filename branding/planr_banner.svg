<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-label="PLANR — Plan your day. Guard your attention. Official release 5 December 2026. Google Play and F-Droid coming soon.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151826"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2136"/>
      <stop offset="1" stop-color="#0E0F13"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="228" rx="26" fill="url(#card)" stroke="#262a3a"/>

  <!-- logo tile: the launcher icon (ring + "P" clock hand) -->
  <g transform="translate(48,49)">
    <rect width="132" height="132" rx="30" fill="url(#tile)" stroke="#2c3148"/>
    <g transform="translate(-0.0,-0.0) scale(1.2222)">
      <circle cx="54" cy="54" r="24" fill="none" stroke="#7C9CFF" stroke-width="5"
              stroke-dasharray="151" stroke-dashoffset="151" stroke-linecap="round"
              transform="rotate(-90 54 54)">
        <animate attributeName="stroke-dashoffset" values="151;0;0;151" keyTimes="0;0.25;0.9;1"
                 dur="8s" repeatCount="indefinite"/>
      </circle>
      <rect x="51" y="40" width="6" height="16" fill="#FFFFFF"/>
      <rect x="51" y="53" width="14" height="6" fill="#FFFFFF"/>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="214" y="104" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="3">PLANR</text>
    <text x="216" y="140" font-size="22" fill="#B8C3E6">Plan your day. Guard your attention.</text>
    <text x="216" y="168" font-size="15" fill="#7C819A">Habit · Alarm · Reminders · Notes · Routines — offline, open source</text>

    <!-- launch pill -->
    <g transform="translate(216,182)">
      <rect width="344" height="30" rx="15" fill="#2A3354"/>
      <circle cx="17" cy="15" r="5" fill="#5BD6A0"/>
      <text x="30" y="20" font-size="14" font-weight="600" fill="#DDE3FF">Out 5 Dec 2026 · Play &amp; F-Droid coming soon</text>
    </g>
  </g>
</svg>
